# ===================================================================
# PRODUCTION Profile Configuration (Render Deployment)
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All sensitive values are sourced from environment variables.
# ===================================================================

# --- Server ---
server.port=${PORT:8080}

# --- PostgreSQL Database (Render managed) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# --- Disable H2 Console in Production ---
spring.h2.console.enabled=false

# --- Weak Topic Detection Thresholds ---
app.thresholds.weak=${WEAK_THRESHOLD:60.0}
app.thresholds.strong=${STRONG_THRESHOLD:75.0}

# --- Prediction Model Weights ---
app.prediction.weights.historical-risk=40.0
app.prediction.weights.recent-risk=25.0
app.prediction.weights.wrong-answer-rate=15.0
app.prediction.weights.trend-risk=10.0
app.prediction.weights.inactivity-risk=10.0

# --- CORS (Frontend Origin) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- File Uploads ---
app.upload.dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Logging ---
logging.level.root=WARN
logging.level.com.personalizedlearning=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
