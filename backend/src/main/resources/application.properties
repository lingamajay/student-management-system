# ===================================================================
# Backend Application Configuration: Personalized Learning System
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Embedded Persistent H2 in MySQL mode)
# Zero-configuration out of the box. Automatically persists in ./data/
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/learningdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Weak Topic Detection Thresholds (Configurable)
# -------------------------------------------------------------------
app.thresholds.weak=60.0
app.thresholds.strong=75.0

# -------------------------------------------------------------------
# Weak Topic Prediction Model Weights (Must sum to 100.0)
# -------------------------------------------------------------------
app.prediction.weights.historical-risk=40.0
app.prediction.weights.recent-risk=25.0
app.prediction.weights.wrong-answer-rate=15.0
app.prediction.weights.trend-risk=10.0
app.prediction.weights.inactivity-risk=10.0

# -------------------------------------------------------------------
# File Uploads
# -------------------------------------------------------------------
app.upload.dir=uploads/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------------------------------------------------
# CORS Configuration (Overridden per-profile)
# -------------------------------------------------------------------
app.cors.allowed-origins=*

# -------------------------------------------------------------------
# Actuator (Health checks for deployment monitoring)
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Personalized Learning System
info.app.version=1.0.0
info.app.description=Personalized Student Learning and Weak-Topic Prediction System

