<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LearnPredict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/student-management-system/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/student-management-system/index.html">
                <i class="bi bi-mortarboard-fill fs-3 text-primary"></i>
                <span class="brand-font fs-4">LearnPredict</span>
            </a>
            <a href="/student-management-system/login.html" class="btn btn-outline-primary btn-sm">Already registered? Sign In</a>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card card-custom p-4 p-md-5 shadow">
                    <div class="text-center mb-4">
                        <div class="avatar bg-success text-white d-inline-flex p-3 rounded-circle mb-2">
                            <i class="bi bi-person-plus-fill fs-4"></i>
                        </div>
                        <h3 class="fw-bold">Student Registration</h3>
                        <p class="text-muted small">Create your student account to receive tailored weak-topic predictions</p>
                    </div>

                    <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>
                    <div id="register-success" class="alert alert-success d-none" role="alert"></div>

                    <form id="register-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" id="name" class="form-control" placeholder="John Doe" required minlength="2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password *</label>
                                <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" placeholder="9876543210">
                            </div>

                            <div class="col-12 mt-4">
                                <h6 class="fw-bold text-primary border-bottom pb-2"><i class="bi bi-buildings me-2"></i>Academic Profile</h6>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">College / University</label>
                                <input type="text" id="collegeName" class="form-control" placeholder="National Institute of Technology">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Course / Degree</label>
                                <input type="text" id="course" class="form-control" placeholder="B.Tech Computer Science">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-semibold">Year</label>
                                <select id="yearOfStudy" class="form-select">
                                    <option value="1">1st</option>
                                    <option value="2">2nd</option>
                                    <option value="3" selected>3rd</option>
                                    <option value="4">4th</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" id="reg-btn" class="btn btn-primary w-100 py-2 mt-4 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Register Student Account
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <span class="text-muted small">Already have an account? </span>
                        <a href="/student-management-system/login.html" class="fw-bold text-decoration-none">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/student-management-system/js/config.js"></script>
    <script src="/student-management-system/js/api.js"></script>
    <script src="/student-management-system/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('register-alert');
            const successBox = document.getElementById('register-success');
            const submitBtn = document.getElementById('reg-btn');

            alertBox.classList.add('d-none');
            successBox.classList.add('d-none');

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value.trim(),
                role: 'STUDENT',
                collegeName: document.getElementById('collegeName').value.trim(),
                course: document.getElementById('course').value.trim(),
                yearOfStudy: parseInt(document.getElementById('yearOfStudy').value)
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

            try {
                await Auth.register(payload);
                successBox.textContent = 'Account created successfully! Redirecting to login...';
                successBox.classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } catch (err) {
                alertBox.textContent = err.message || 'Registration failed.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Register Student Account';
            }
        });
    </script>
</body>
</html>
