<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LearnPredict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/student-management-system/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/student-management-system/index.html">
                <i class="bi bi-mortarboard-fill fs-3 text-primary"></i>
                <span class="brand-font fs-4">LearnPredict</span>
            </a>
            <a href="/student-management-system/index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-house me-1"></i>Home</a>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 p-md-5 shadow">
                    <div class="text-center mb-4">
                        <div class="avatar bg-primary text-white d-inline-flex p-3 rounded-circle mb-2">
                            <i class="bi bi-lock-fill fs-4"></i>
                        </div>
                        <h3 class="fw-bold">Sign In to Account</h3>
                        <p class="text-muted small">Access your personalized learning dashboard</p>
                    </div>

                    <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@learning.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <span class="text-muted small">New student? </span>
                        <a href="/student-management-system/register.html" class="fw-bold text-decoration-none">Create an Account</a>
                    </div>

                    <!-- Quick Demo Credentials Selector -->
                    <div class="mt-4 p-3 bg-light rounded border">
                        <span class="fw-bold text-dark small d-block mb-2 text-center text-uppercase">1-Click Demo Login</span>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-success btn-sm text-start" onclick="fillDemo('student@learning.com', 'student123')">
                                <i class="bi bi-person-fill me-1"></i> <strong>Student Demo:</strong> student@learning.com
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm text-start" onclick="fillDemo('teacher@learning.com', 'teacher123')">
                                <i class="bi bi-person-workspace me-1"></i> <strong>Teacher Demo:</strong> teacher@learning.com
                            </button>
                            <button type="button" class="btn btn-outline-danger btn-sm text-start" onclick="fillDemo('admin@learning.com', 'admin123')">
                                <i class="bi bi-shield-lock-fill me-1"></i> <strong>Admin Demo:</strong> admin@learning.com
                            </button>
                        </div>
                    </div>

                    <!-- Offline Demo Preview Option -->
                    <div class="mt-3 text-center">
                        <button type="button" class="btn btn-link btn-sm text-muted text-decoration-none" onclick="enterOfflineDemo()">
                            <i class="bi bi-play-circle me-1"></i>Explore in Offline Demo Mode (No backend required)
                        </button>
                    </div>

                    <!-- Backend API Setting -->
                    <div class="mt-2 text-center border-top pt-2">
                        <span class="text-muted" style="font-size: 0.75rem;">
                            API Target: <code id="current-api-url" class="text-primary"></code>
                            <a href="#" class="ms-1 text-decoration-none" onclick="changeApiUrl(); return false;">(Change)</a>
                        </span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/student-management-system/js/config.js"></script>
    <script src="/student-management-system/js/api.js"></script>
    <script src="/student-management-system/js/auth.js"></script>
    <script>
        function updateApiDisplay() {
            const el = document.getElementById('current-api-url');
            if (el) {
                el.textContent = CONFIG.API_BASE_URL;
            }
        }
        updateApiDisplay();

        function changeApiUrl() {
            const current = localStorage.getItem('api_base_url') || CONFIG.API_BASE_URL;
            const newUrl = prompt('Enter your Spring Boot Backend API URL (e.g., https://your-backend.onrender.com/api or http://localhost:8080/api):', current);
            if (newUrl !== null && newUrl.trim() !== '') {
                localStorage.setItem('api_base_url', newUrl.trim().replace(/\/$/, ''));
                alert('Backend URL updated! The page will now reload.');
                window.location.reload();
            }
        }

        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        function enterOfflineDemo() {
            // Allows users to explore the dashboard immediately with sample student profile
            const demoUser = {
                id: 3,
                name: "Rahul Verma (Demo)",
                email: "student@learning.com",
                role: "STUDENT"
            };
            Auth.setUser(demoUser, "offline-demo-token");
            window.location.href = `${Auth.getBasePath()}/student/dashboard.html`;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-btn');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            try {
                const res = await Auth.login(email, password);
                const base = Auth.getBasePath();
                if (res.role === 'TEACHER') {
                    window.location.href = `${base}/teacher/dashboard.html`;
                } else if (res.role === 'ADMIN') {
                    window.location.href = `${base}/admin/dashboard.html`;
                } else {
                    window.location.href = `${base}/student/dashboard.html`;
                }
            } catch (err) {
                let msg = err.message || 'Login failed. Please check credentials.';
                if (msg.includes('unreachable') || msg.includes('Failed to fetch')) {
                    msg = `<strong>Backend server is unreachable!</strong><br><small class="text-dark">The Java Spring Boot API is not running at <code>${CONFIG.API_BASE_URL}</code>. Deploy it on Render, run it locally, or use the <strong>Explore in Offline Demo Mode</strong> button below to preview the UI.</small>`;
                    alertBox.innerHTML = msg;
                } else {
                    alertBox.textContent = msg;
                }
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        });
    </script>
</body>
</html>
