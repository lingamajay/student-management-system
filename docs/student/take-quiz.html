<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - LearnPredict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/student-management-system/css/style.css">
    <link rel="stylesheet" href="/student-management-system/css/dashboard.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-custom sticky-top">
        <div class="container">
            <span class="navbar-brand">
                <i class="bi bi-mortarboard-fill fs-3 text-primary"></i>
                <span class="brand-font fs-4">LearnPredict Exam Portal</span>
            </span>
            <div class="d-flex align-items-center gap-3">
                <div class="badge bg-dark px-3 py-2 fs-6">
                    <i class="bi bi-clock me-1 text-warning"></i>
                    <span id="quiz-timer">15:00</span>
                </div>
                <button class="btn btn-outline-danger btn-sm" onclick="cancelQuiz()">Exit Quiz</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">

                <!-- Quiz Header Info -->
                <div class="card card-custom p-4 mb-4 shadow-sm border-start border-4 border-primary">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary mb-1" id="quiz-subject">Subject</span>
                            <h3 class="fw-bold mb-1" id="quiz-title">Quiz Assessment</h3>
                            <p class="text-muted small mb-0"><i class="bi bi-bookmark me-1"></i>Topic: <strong id="quiz-topic">Topic Name</strong></p>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-secondary" id="quiz-total-q">10 Questions</span>
                        </div>
                    </div>
                </div>

                <!-- Questions Container -->
                <form id="quiz-submission-form">
                    <div id="questions-list">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-2">Loading quiz questions...</p>
                        </div>
                    </div>

                    <!-- Submit Action Bar -->
                    <div class="card card-custom p-3 shadow-sm text-end mt-4 sticky-bottom bg-white border">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted small" id="answered-counter">0 of 0 answered</span>
                            <button type="submit" id="submit-btn" class="btn btn-success px-4 py-2 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i> Submit Quiz Answers
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/student-management-system/js/config.js"></script>
    <script src="/student-management-system/js/api.js"></script>
    <script src="/student-management-system/js/auth.js"></script>
    <script>
        let quizData = null;
        let startTime = Date.now();
        let timerInterval = null;

        function cancelQuiz() {
            if (confirm('Are you sure you want to exit? Your answers will not be saved.')) {
                window.location.href = '/student/quiz-list.html';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireRole('STUDENT')) return;

            const urlParams = new URLSearchParams(window.location.search);
            const quizId = urlParams.get('quizId');

            if (!quizId) {
                alert('No Quiz ID specified');
                window.location.href = '/student/quiz-list.html';
                return;
            }

            try {
                quizData = await API.get(`/quizzes/${quizId}`);

                document.getElementById('quiz-title').textContent = quizData.title;
                document.getElementById('quiz-subject').textContent = quizData.subjectName || 'Subject';
                document.getElementById('quiz-topic').textContent = quizData.topicName || 'Topic';
                document.getElementById('quiz-total-q').textContent = `${quizData.questions.length} Questions`;

                startTimer(quizData.durationMinutes || 15);
                renderQuestions(quizData.questions);
            } catch (err) {
                document.getElementById('questions-list').innerHTML = `
                    <div class="alert alert-danger">Error loading quiz: ${err.message}</div>
                `;
            }
        });

        function startTimer(durationMinutes) {
            let totalSeconds = durationMinutes * 60;
            const timerElem = document.getElementById('quiz-timer');

            timerInterval = setInterval(() => {
                totalSeconds--;
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert('Time is up! Automatically submitting your answers.');
                    document.getElementById('quiz-submission-form').dispatchEvent(new Event('submit'));
                    return;
                }

                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                timerElem.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-list');
            if (!questions || questions.length === 0) {
                container.innerHTML = '<div class="alert alert-warning">This quiz does not have any questions configured.</div>';
                return;
            }

            container.innerHTML = questions.map((q, idx) => `
                <div class="card card-custom p-4 mb-4 shadow-sm">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-primary">Question ${idx + 1} of ${questions.length}</span>
                        <span class="badge bg-light text-muted border">${q.marks} Mark</span>
                    </div>
                    <h5 class="fw-bold mb-3">${q.questionText}</h5>
                    <div class="options-container">
                        ${q.options.map((opt, optIdx) => `
                            <div>
                                <input type="radio" class="d-none quiz-option-input" 
                                       name="q_${q.id}" id="opt_${opt.id}" 
                                       value="${opt.id}" onchange="updateAnsweredCount()">
                                <label class="quiz-option-label" for="opt_${opt.id}">
                                    <div class="quiz-option-circle">${String.fromCharCode(65 + optIdx)}</div>
                                    <div>${opt.optionText}</div>
                                </label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updateAnsweredCount();
        }

        function updateAnsweredCount() {
            if (!quizData) return;
            const selected = document.querySelectorAll('.quiz-option-input:checked').length;
            document.getElementById('answered-counter').textContent = `${selected} of ${quizData.questions.length} answered`;
        }

        document.getElementById('quiz-submission-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearInterval(timerInterval);

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Evaluating answers...';

            const user = Auth.getUser();
            const answers = [];

            quizData.questions.forEach(q => {
                const checked = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (checked) {
                    answers.push({
                        questionId: q.id,
                        selectedOptionId: parseInt(checked.value)
                    });
                }
            });

            const timeTakenSeconds = Math.round((Date.now() - startTime) / 1000);

            const payload = {
                quizId: quizData.id,
                studentId: user.id,
                timeTakenSeconds,
                answers
            };

            try {
                const result = await API.post('/quiz-attempts/submit', payload);
                // Store result in sessionStorage for instant rendering
                sessionStorage.setItem('last_quiz_result', JSON.stringify(result));
                window.location.href = `/student/quiz-result.html?attemptId=${result.attemptId}`;
            } catch (err) {
                alert('Submission error: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Submit Quiz Answers';
            }
        });
    </script>
</body>
</html>
